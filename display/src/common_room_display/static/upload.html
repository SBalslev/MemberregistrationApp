<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <title>Tilføj foto</title>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--cp-bg); color: var(--cp-text); font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; }
    main { width: min(34rem, 100%); margin: 0 auto; padding: 3rem 1.25rem; }
    h1 { margin: 0 0 0.5rem; font-size: 2.4rem; letter-spacing: 0; }
    p { color: var(--cp-text-muted); line-height: 1.5; }
    form { margin-top: 2rem; padding: 1.5rem; border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-surface); }
    label { display: block; margin-bottom: 0.5rem; font-weight: 700; }
    input { width: 100%; padding: 1rem; border: 1px solid var(--cp-border-strong); border-radius: 0.625rem; background: var(--cp-surface-soft); color: var(--cp-text); }
    button { width: 100%; margin-top: 1rem; padding: 1rem; border: 0; border-radius: 0.625rem; background: var(--cp-accent); color: var(--cp-accent-fg); font: inherit; font-weight: 700; }
    button:disabled { opacity: 0.55; }
    #message { min-height: 1.5rem; margin-top: 1rem; }
    .success { color: var(--cp-success); }
    .error { color: var(--cp-danger); }
  </style>
</head>
<body>
  <main>
    <h1>Tilføj et foto</h1>
    <p>Fotoet vises på skærmen i cirka fire timer. Vælg kun et foto, som alle på billedet er indforstået med at dele i klubben.</p>
    <form id="upload-form">
      <label for="photo">Vælg foto</label>
      <input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required>
      <button id="submit" type="submit">Send til skærmen</button>
      <div id="message" role="status"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById("upload-form");
    const photo = document.getElementById("photo");
    const submit = document.getElementById("submit");
    const message = document.getElementById("message");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = photo.files[0];
      if (!file) return;
      submit.disabled = true;
      message.className = "";
      message.textContent = "Sender foto...";
      try {
        const response = await fetch("/api/uploads", {
          method: "POST",
          headers: { "Content-Type": file.type },
          body: file
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Fotoet kunne ikke sendes");
        message.className = "success";
        message.textContent = "Fotoet er sendt til skærmen.";
        form.reset();
      } catch (error) {
        message.className = "error";
        message.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
